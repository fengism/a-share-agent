services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # 容器化部署固定经 frontend 的 Nginx 反代，需信任其透传的 X-Forwarded-For
      # 才能拿到真实客户端 IP 做限流。可被 .env 中的同名变量覆盖。
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
