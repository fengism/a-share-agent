services:
  backend:
    image: ${BACKEND_IMAGE:-fengliu1989/a-share-backend:main}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    build:
      context: ./backend
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
        APP_VERSION: "${APP_VERSION:-dev}"
        APP_REVISION: "${APP_REVISION:-dev}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    env_file: .env
    environment:
      # backend 只在 Compose 内网暴露，并固定经 frontend Nginx 反代。
      TRUST_PROXY_HEADERS: "true"
      # HOME 指向 data 卷：tdxhub 等库的 ~/.tdxhub 缓存随卷持久化（容器重启不丢）
      HOME: /app/data/home
    volumes:
      # tdxhub 客户端缓存（镜像内 ~/.tdxhub 软链至此）随 data 卷持久化
      - ./data:/app/data
      - ./logs:/app/logs
      - ${QUANT_STRATEGY_HOST_DIR:-./backend/app/modules/quant/strategies/definitions}:/app/data/quant-strategies:ro
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/app/.cache:size=128m,uid=${APP_UID:-1000},gid=${APP_GID:-1000},mode=0700
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-fengliu1989/a-share-frontend:main}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    build: ./frontend
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    ports:
      - "${DOCKER_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${DOCKER_FRONTEND_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101,mode=0700
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.1.2
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "1"
      DELETE: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      EXEC: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - updater-control
    # 注意：此镜像 entrypoint 启动时要写 /usr/local/etc/haproxy/haproxy.cfg，
    # 因此不能对根文件系统设 read_only（生产环境验证过的行为）。
    tmpfs:
      - /run:size=8m,mode=0755
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  updater:
    # 在线更新执行器：轮询 data 卷里的更新请求标记文件（由后端管理员触发时写入），
    # 检测到后拉取新镜像并重建 backend/frontend。不自动定时更新。
    # 仅通过内网 socket proxy 使用 Compose 所需的 Docker API；不直接挂载 docker.sock。
    # 项目目录只读挂载，仅 data 目录可写（写更新事务状态）。
    # 默认使用执行 docker compose 时的宿主机 PWD；若从其他目录通过 -f 启动，
    # 需将 HOST_PROJECT_DIR 显式设为本 compose 文件所在目录的绝对路径。
    image: docker:27.5.1-cli
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-${PWD}}
      UPDATE_BACKEND_IMAGE_REPOSITORY: ${UPDATE_HUB_NAMESPACE:-fengliu1989}/${UPDATE_HUB_REPO:-a-share-backend}
      UPDATE_FRONTEND_IMAGE_REPOSITORY: ${UPDATE_HUB_NAMESPACE:-fengliu1989}/${UPDATE_HUB_FRONTEND_REPO:-a-share-frontend}
    working_dir: ${HOST_PROJECT_DIR:-${PWD}}
    command: ["sh", "scripts/docker-updater.sh"]
    depends_on:
      docker-socket-proxy:
        condition: service_started
    volumes:
      - .:${HOST_PROJECT_DIR:-${PWD}}:ro
      - ./data:${HOST_PROJECT_DIR:-${PWD}}/data
    networks:
      - updater-control
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 60s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  updater-control:
    internal: true
