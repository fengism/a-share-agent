services:
  tdx-api:
    image: "${TDX_IMAGE:-fengliu1989/tdx:sha-e814a9cb6c2480903186d28a219de5d175499fce@sha256:dc4a9573c01e26f9f904c8f2ec2cbf524618c407d0a137e3490179b1328ce421}"
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${TDX_API_BIND_ADDRESS:-127.0.0.1}:${TDX_API_PORT:-18080}:18080"
    environment:
      TDX_HTTP_ADDR: ":18080"
      TDX_HOSTS: "${TDX_HOSTS:-}"
      TDX_POOL_SIZE: "${TDX_POOL_SIZE:-1}"
      TDX_DIAL_TIMEOUT: "${TDX_DIAL_TIMEOUT:-5s}"
      TDX_SHUTDOWN_TIMEOUT: "${TDX_SHUTDOWN_TIMEOUT:-10s}"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18080/ready"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  backend:
    build:
      context: ./backend
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    env_file: .env
    environment:
      # backend 只在 Compose 内网暴露，并固定经 frontend Nginx 反代。
      TRUST_PROXY_HEADERS: "true"
      TDX_HTTP_ENABLED: "true"
      TDX_HTTP_BASE_URL: "http://tdx-api:18080"
      QUANT_STRATEGY_DIR: "/app/data/quant-strategies"
    depends_on:
      tdx-api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ${QUANT_STRATEGY_HOST_DIR:-./backend/app/modules/quant/strategies/definitions}:/app/data/quant-strategies:ro
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/app/.cache:size=128m,uid=${APP_UID:-1000},gid=${APP_GID:-1000},mode=0700
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    ports:
      - "${DOCKER_FRONTEND_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101,mode=0700
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
