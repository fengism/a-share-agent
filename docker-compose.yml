# 容器内 127.0.0.1 指向容器自身，宿主机 shell 里的代理（如 Clash 的 127.0.0.1:10808）
# 永远不可达；Compose 会把这些变量自动注入容器，导致全部出网请求 Connection refused。
# 这里显式置空以覆盖注入；确需走代理时改用宿主机可达地址并加
# extra_hosts: ["host.docker.internal:host-gateway"]。
x-direct-network-env: &direct-network-env
  TZ: "${TZ:-Asia/Shanghai}"
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""

# 不设置 platform: linux/amd64；多架构镜像由 Docker 按宿主机选择。
# ARM64/aarch64 与 x86_64/amd64 都运行原生 Chromium，避免 PDF 导出经过 QEMU。
services:
  backend:
    image: ${BACKEND_IMAGE:-fengliu1989/a-share-backend:main}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    build:
      context: ./backend
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
        APP_VERSION: "${APP_VERSION:-dev}"
        APP_REVISION: "${APP_REVISION:-dev}"
    init: true
    restart: unless-stopped
    # 后台任务与连接需要时间优雅关闭；宽限期太短会被 SIGKILL 掐断，
    # 导致关机流程走不完、下次启动又退回全库 quick_check。
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    env_file: .env
    environment:
      # backend 只在 Compose 内网暴露，并固定经 frontend Nginx 反代。
      TRUST_PROXY_HEADERS: "true"
      # HOME 指向 data 卷：tdxhub 等库的 ~/.tdxhub 缓存随卷持久化（容器重启不丢）
      HOME: /app/data/home
      <<: *direct-network-env
    volumes:
      # tdxhub 客户端缓存（镜像内 ~/.tdxhub 软链至此）随 data 卷持久化
      - ./data:/app/data
      - ./logs:/app/logs
      - ${QUANT_STRATEGY_HOST_DIR:-./backend/app/modules/quant/strategies/definitions}:/app/data/quant-strategies:ro
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/app/.cache:size=128m,uid=${APP_UID:-1000},gid=${APP_GID:-1000},mode=0700
    networks:
      - default
      - python-control
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      # 首次启动需要对 market_daily（约 12.9 GiB）做迁移/预热，冷启动可达数十分钟。
      # start_period 内的探测失败不计入 retries，若沿用 90s，每次 up 都会
      # "dependency failed to start"。1800s 覆盖最坏冷启动；崩溃恢复时
      # 完整性检查仍在后台进行，不受此值影响。
      start_period: 1800s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-fengliu1989/a-share-frontend:main}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    build: ./frontend
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    ports:
      - "${DOCKER_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${DOCKER_FRONTEND_PORT:-8080}:8080"
    environment:
      # healthcheck 里的 wget 也会读代理变量，置空后才是真正的本地探活
      <<: *direct-network-env
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101,mode=0700
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  # Optional Python control plane. Build both targets before enabling the profile.
  # This service is trusted infrastructure with Docker control privileges; never expose its port.
  # Submitted code runs in separate, networkless containers with NO socket/volume mounts.
  python-runner:
    profiles: ["python-sandbox"]
    image: ${PYTHON_RUNNER_IMAGE:-fengliu1989/a-share-python-runner:main}
    build:
      context: ./sandbox
      target: runner
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      PYTHON_SANDBOX_TOKEN: ${PYTHON_SANDBOX_TOKEN:-}
      PYTHON_SANDBOX_IMAGE: ${PYTHON_SANDBOX_IMAGE:-fengliu1989/a-share-python-sandbox:main}
      <<: *direct-network-env
    volumes:
      - ${PYTHON_SANDBOX_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - python-control
    expose:
      - "8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Build-only target. Jobs are created by python-runner, never as a shared Compose worker.
  python-sandbox-image:
    profiles: ["python-sandbox-build"]
    image: ${PYTHON_SANDBOX_IMAGE:-fengliu1989/a-share-python-sandbox:main}
    build:
      context: ./sandbox
      target: worker
    network_mode: none
    read_only: true
    entrypoint: ["/usr/local/bin/python", "-c", "pass"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:0.1.2}
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "1"
      DELETE: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      EXEC: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - updater-control
    expose:
      - "2375"
    # 注意：此镜像 entrypoint 启动时要写 /usr/local/etc/haproxy/haproxy.cfg，
    # 因此不能对根文件系统设 read_only（生产环境验证过的行为）。
    tmpfs:
      - /run:size=8m,mode=0755
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  updater:
    # 在线更新执行器：轮询 data 卷里的更新请求标记文件（由后端管理员触发时写入），
    # 检测到后拉取新镜像并重建 backend/frontend。不自动定时更新。
    # 仅通过内网 socket proxy 使用 Compose 所需的 Docker API；不直接挂载 docker.sock。
    # 项目目录只读挂载，仅 data 目录可写（写更新事务状态）。
    # 默认使用执行 docker compose 时的宿主机 PWD；若从其他目录通过 -f 启动，
    # 需将 HOST_PROJECT_DIR 显式设为本 compose 文件所在目录的绝对路径。
    image: ${DOCKER_CLI_IMAGE:-docker:27.5.1-cli}
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-${PWD}}
      UPDATE_BACKEND_IMAGE_REPOSITORY: ${UPDATE_HUB_NAMESPACE:-fengliu1989}/${UPDATE_HUB_REPO:-a-share-backend}
      UPDATE_FRONTEND_IMAGE_REPOSITORY: ${UPDATE_HUB_NAMESPACE:-fengliu1989}/${UPDATE_HUB_FRONTEND_REPO:-a-share-frontend}
    working_dir: ${HOST_PROJECT_DIR:-${PWD}}
    command: ["sh", "scripts/docker-updater.sh"]
    depends_on:
      docker-socket-proxy:
        condition: service_started
    volumes:
      - .:${HOST_PROJECT_DIR:-${PWD}}:ro
      - ./data:${HOST_PROJECT_DIR:-${PWD}}/data
    networks:
      - updater-control
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 60s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  python-control:
    internal: true
  updater-control:
    internal: true
