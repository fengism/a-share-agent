services:
  backend:
    build:
      context: ./backend
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      # backend 只在 Compose 内网暴露，并固定经 frontend Nginx 反代。
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${DOCKER_FRONTEND_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
