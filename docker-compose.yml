services:
  tdx-api:
    image: "${TDX_IMAGE:-fengliu1989/tdx:sha-0c2f854fc78696eefd8891e55dd3b37323cf309d@sha256:6c6cf5d652d9c706b598dc47143a96d188e01ac9d3ecfa0d9d03785ee7f1c7ae}"
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${TDX_API_BIND_ADDRESS:-127.0.0.1}:${TDX_API_PORT:-18080}:18080"
    environment:
      TDX_HTTP_ADDR: ":18080"
      TDX_HOSTS: "${TDX_HOSTS:-}"
      TDX_POOL_SIZE: "${TDX_POOL_SIZE:-1}"
      TDX_DIAL_TIMEOUT: "${TDX_DIAL_TIMEOUT:-5s}"
      TDX_SHUTDOWN_TIMEOUT: "${TDX_SHUTDOWN_TIMEOUT:-10s}"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18080/ready"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  backend:
    image: ${BACKEND_IMAGE:-fengliu1989/a-share-backend:main}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    build:
      context: ./backend
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
        APP_VERSION: "${APP_VERSION:-main}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    env_file: .env
    environment:
      # backend 只在 Compose 内网暴露，并固定经 frontend Nginx 反代。
      TRUST_PROXY_HEADERS: "true"
      TDX_HTTP_ENABLED: "true"
      TDX_HTTP_BASE_URL: "http://tdx-api:18080"
    depends_on:
      tdx-api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ${QUANT_STRATEGY_HOST_DIR:-./backend/app/modules/quant/strategies/definitions}:/app/data/quant-strategies:ro
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/app/.cache:size=128m,uid=${APP_UID:-1000},gid=${APP_GID:-1000},mode=0700
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-fengliu1989/a-share-frontend:main}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    build: ./frontend
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    ports:
      - "${DOCKER_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${DOCKER_FRONTEND_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101,mode=0700
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  updater:
    # 在线更新执行器：轮询 data 卷里的更新请求标记文件（由后端管理员触发时写入），
    # 检测到后拉取新镜像并重建 backend/frontend。不自动定时更新。
    # 挂载 docker.sock 等价于宿主机 root 权限，故只在内网、不暴露端口；
    # 项目目录只读挂载，仅 data 目录可写（写更新请求标记）。
    # HOST_PROJECT_DIR 必须设为本 compose 文件所在目录的宿主机绝对路径，
    # 保证容器内运行的 docker compose 解析 ./data 等相对路径时与宿主机一致。
    image: docker:cli
    restart: unless-stopped
    working_dir: ${HOST_PROJECT_DIR:-/project}
    command: >
      sh -c 'while true; do
        if [ -f "$${HOST_PROJECT_DIR}/data/update-request.json" ]; then
          rm -f "$${HOST_PROJECT_DIR}/data/update-request.json";
          cd "$${HOST_PROJECT_DIR}" &&
          docker compose pull backend frontend &&
          docker compose up -d backend frontend;
        fi;
        sleep 15;
      done'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:${HOST_PROJECT_DIR:-/project}:ro
      - ./data:${HOST_PROJECT_DIR:-/project}/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 60s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
