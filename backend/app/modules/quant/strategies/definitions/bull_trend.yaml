api_version: quant.strategy/v1
key: bull_trend
version: 1.0.0
enabled: true
name: 多头趋势
description: MA5、MA10、MA20 多头排列且 MA20 向上、价格乖离不过高时持有。
scenario: 上升趋势
risk_level: medium
presentation: { icon: rise }
parameters:
  bias_limit: { type: number, label: 最大乖离率, default: 5.0, minimum: 0, maximum: 30, step: 0.5 }
  slope_lookback: { type: integer, label: 趋势回溯, default: 5, minimum: 1, maximum: 30 }
indicators:
  ma5: { operator: sma, input: close, period: 5 }
  ma10: { operator: sma, input: close, period: 10 }
  ma20: { operator: sma, input: close, period: 20 }
  ma20_previous: { operator: sma, input: ma20, period: 1, offset: $slope_lookback }
  distance: { operator: subtract, left: close, right: ma5 }
  bias_ratio: { operator: divide, left: distance, right: ma5, zero_value: 0 }
  bias: { operator: multiply, left: bias_ratio, right: 100 }
signals:
  entry:
    operator: and
    operands:
      - { operator: greater_or_equal, left: ma5, right: ma10 }
      - { operator: greater_or_equal, left: ma10, right: ma20 }
      - { operator: greater_than, left: ma20, right: ma20_previous }
      - { operator: less_or_equal, left: bias, right: $bias_limit }
  exit: { operator: less_than, left: close, right: ma20 }
position: { mode: binary }
