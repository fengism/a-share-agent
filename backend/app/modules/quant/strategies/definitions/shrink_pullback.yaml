api_version: quant.strategy/v1
key: shrink_pullback
version: 1.0.0
enabled: true
name: 缩量回踩
description: 多头排列中价格回踩 MA5 或 MA10 且成交量明显收缩时入场。
scenario: 趋势回调
risk_level: medium
presentation: { icon: swap }
parameters:
  price_band: { type: number, label: 均线容差, default: 0.02, minimum: 0.005, maximum: 0.1, step: 0.005 }
  volume_ratio: { type: number, label: 缩量比例, default: 0.6, minimum: 0.1, maximum: 1, step: 0.05 }
indicators:
  ma5: { operator: sma, input: close, period: 5 }
  ma10: { operator: sma, input: close, period: 10 }
  ma20: { operator: sma, input: close, period: 20 }
  volume_ma5: { operator: sma, input: volume, period: 5, offset: 1 }
  volume_threshold: { operator: multiply, left: volume_ma5, right: $volume_ratio }
  lower_factor: { operator: subtract, left: 1, right: $price_band }
  upper_factor: { operator: add, left: 1, right: $price_band }
  ma5_lower: { operator: multiply, left: ma5, right: lower_factor }
  ma5_upper: { operator: multiply, left: ma5, right: upper_factor }
  ma10_lower: { operator: multiply, left: ma10, right: lower_factor }
  ma10_upper: { operator: multiply, left: ma10, right: upper_factor }
signals:
  entry:
    operator: and
    operands:
      - { operator: greater_than, left: ma5, right: ma10 }
      - { operator: greater_than, left: ma10, right: ma20 }
      - { operator: less_than, left: volume, right: volume_threshold }
      - operator: or
        operands:
          - operator: and
            operands:
              - { operator: greater_or_equal, left: close, right: ma5_lower }
              - { operator: less_or_equal, left: close, right: ma5_upper }
          - operator: and
            operands:
              - { operator: greater_or_equal, left: close, right: ma10_lower }
              - { operator: less_or_equal, left: close, right: ma10_upper }
  exit: { operator: less_than, left: close, right: ma20 }
position: { mode: binary }
