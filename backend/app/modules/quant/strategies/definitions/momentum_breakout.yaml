api_version: quant.strategy/v1
key: momentum_breakout
version: 1.0.0
enabled: true
name: 动量突破
description: 突破近 20 日高点后跟随趋势，跌破均值后退出。
scenario: 强势趋势
risk_level: high
presentation:
  icon: rise
parameters:
  lookback_period:
    type: integer
    label: 突破周期
    description: 计算前期高点与均值的回看周期
    default: 20
    minimum: 2
    maximum: 250
indicators:
  previous_high:
    operator: rolling_max
    input: close
    period: $lookback_period
    offset: 1
  previous_average:
    operator: sma
    input: close
    period: $lookback_period
    offset: 1
signals:
  entry:
    operator: greater_or_equal
    left: close
    right: previous_high
  exit:
    operator: less_than
    left: close
    right: previous_average
position:
  mode: binary

