slug: solid-state-battery
name: 固态电池
category: 新能源与先进储能
summary: 涵盖固态电解质(氧化物/硫化物/聚合物)、新型高能量密度正负极(高镍三元/富锂锰基/硅碳负极/锂金属)、先进干法电极及固态电芯制造，下游延伸至高端动力车、低空飞行器eVTOL及特种消费电子的完整产业链。
aliases: [全固态电池, 半固态电池, 固态电解质, 固态储能, 原位固态化电池]
tags: [新能源, 动力电池, 固态电池, 锂电池, 储能, 先进材料, 电解质]
drivers:
  - 传统液态锂电池能量密度逼近 350Wh/kg 理论极限，安全与续航要求加速技术变革
  - 固态电解质从根本上杜绝液态有机溶剂燃烧爆炸风险，热失控安全性大幅跃升
  - 低空经济 eVTOL、长续航智能汽车及机器人对高能量密度轻量化电池的刚性需求
  - 半固态向全固态技术路线快速推进，各主机厂量产装车时间表密集公布
