          - { name: 当升科技, code: "300073", note: 锂电正极与固态电解质开拓者，超高镍正极及固态电解质批量出货 }
          - { name: 上海洗霸, code: "603200", note: 重点布局先进固态电解质粉体及原位固态化涂覆浆料 }
