slug: energy-storage
name: 新型储能系统
category: 新能源与先进储能
summary: 涵盖储能专用大容量电芯、储能变流器 (PCS)、电池管理 (BMS)、能量管理 (EMS)、工业级液冷温控与消防安全，以及电网侧大储/工商业微电网/户储系统集成与运营商生态。
aliases: [储能, 新型储能, 储能系统, 大储, 工商业储能, 户用储能, 储能变流器]
tags: [储能, PCS, 储能电芯, 液冷温控, 储能集成, 构网型储能]
drivers:
  - 风光高比例并网驱动刚性配储需求，容量电价与电力现货峰谷价差机制完善
  - 全球大储需求爆发，北美/欧洲/中东/澳洲表前独立储能项目规模翻倍
  - 314Ah+ 大容量电芯与 5MWh+ 标准液冷储能舱全面量产，平准化度电成本 (LCOS) 大幅下降
  - 弱电网环境下构网型储能 (Grid-Forming) 成为电网准入核心技术壁垒
layers:
