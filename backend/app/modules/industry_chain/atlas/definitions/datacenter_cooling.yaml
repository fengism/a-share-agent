slug: datacenter-cooling
name: 智算中心与液冷散热
category: 人工智能与先进计算
summary: 围绕超大规模 AI 算力集群的高密数据中心基础设施，覆盖电子级氟化冷却液/高速铜材、冷板/CDU分配单元/浸没式散热/高速背板连接器、以及绿色智算中心 AIDC 建设与液冷整机柜集成生态。
aliases: [液冷, 液冷服务器, 数据中心散热, 智算中心, 高速铜连接, 算力基础设施, 液冷温控]
tags: [液冷, 智算中心, 冷板, 浸没式液冷, 高速连接器, 算力租赁]
drivers:
  - AI 大模型集群单机柜功耗从 10kW 飙升至 100kW+，传统风冷达到物理极限，液冷成为万卡智算标配
  - 国家与地方对数据中心综合能耗 PUE 严格限制在 1.15-1.25 以下，政策强制推动绿色改造
  - 芯片间高密度互联推动无源铜缆 (DAC/ACC) 与超高速背板连接器需求倍增
  - 国内外云厂商及三大运营商智算中心资本开支高景气增长
