slug: commercial-aerospace
name: 商业航天
category: 空天信息与先进国防
summary: 涵盖商业运载火箭（发动机/箭体结构/液体姿控）、低轨通信与遥感卫星制造（相控阵T/R组件/星载通信载荷/太阳翼）、地面测控发射站网以及低轨卫星互联网运营与空天地一体化通信的完整产业链。
aliases: [商业运载火箭, 卫星互联网, 低轨卫星, 空天信息, 商业卫星, 航天产业链]
tags: [商业航天, 卫星互联网, 航空航天, 低轨星座, 军工, 通信, 空间技术]
drivers:
  - 全球低轨空间轨道与Ku/Ka频段资源稀缺，先登先占原则驱动万星发射竞赛
  - 国家星网（GW星座）与千帆星座（G60）规模化招投标与常态化组网发射
  - 民营可重复使用商业液体火箭（如朱雀/天兵/星河动力等）突破运力瓶颈并大幅降低入轨成本
  - 手机直连卫星、低空通导一体化及特种海事通信等商业闭环应用场景加速开启
layers:
