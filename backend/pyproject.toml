[project]
name = "stock-agent-backend"
version = "0.1.0"
description = "A 股智能分析系统后端，支持分时、K 线、财报、估值与 AI 分析"
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "stock-agent contributors" },
]
keywords = ["stock", "analysis", "fastapi", "akshare", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "akshare>=1.16.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.60.0",
    "litellm>=1.55.0",
    "sse-starlette>=2.0.0",
    "pypinyin>=0.52.0",
    "mootdx>=0.9.11",
    "feedparser>=6.0.12",
    "beautifulsoup4>=4.12.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
web-fetch = [
    "scrapling[fetchers]>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "mypy>=1.17.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conservative baseline: pyflakes (F), import sorting (I) and core pycodestyle (E).
# Line length is enforced by the formatter, not the linter, so E501 is ignored.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# self-test/demo blocks and package inits keep their imports/prints
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = [
    "app/agentic/research.py",
    "app/agentic/tools/application.py",
    "app/agentic/tools/packs/stock/financial_analysis.py",
    "app/agentic/tools/packs/web/content.py",
    "app/core/exceptions.py",
    "app/core/progress.py",
    "app/core/retry.py",
    "app/market_data/market/quotes/statistic.py",
    "app/modules/quant/engine.py",
    "app/modules/stock/compare.py",
    "app/runtime/agentic_tools.py",
    "app/runtime/task_scheduler.py",
]
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
