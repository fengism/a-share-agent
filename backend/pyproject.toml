[project]
name = "stock-agent-backend"
version = "0.2.0"
description = "A 股智能分析系统后端，支持分时、K 线、财报、估值与 AI 分析"
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "stock-agent contributors" },
]
keywords = ["stock", "analysis", "fastapi", "akshare", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "akshare>=1.16.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.60.0",
    "litellm>=1.55.0",
    "sse-starlette>=2.0.0",
    "pypinyin>=0.52.0",
    "tdxhub-sdk>=0.1.0",
    "feedparser>=6.0.12",
    "beautifulsoup4>=4.12.0",
    "cryptography>=44.0.0",
    "pyyaml>=6.0",
    "scrapling[fetchers]>=0.4",
    "curl-cffi>=0.13.0",
    "httpx>=0.28.0",
    "packaging>=24.0",
    "playwright>=1.55.0",
    "pypdf>=6.16.2",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.17.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conservative baseline: pyflakes (F), import sorting (I) and core pycodestyle (E).
# Line length is enforced by the formatter, not the linter, so E501 is ignored.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# self-test/demo blocks and package inits keep their imports/prints
"**/__init__.py" = ["F401"]

