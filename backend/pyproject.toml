[project]
name = "stock-agent-backend"
version = "0.7.1"
description = "A 股智能分析系统后端，支持分时、K 线、财报、估值与 AI 分析"
license = "MIT"
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "stock-agent contributors" },
]
keywords = ["stock", "analysis", "fastapi", "akshare", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "akshare>=1.16.0",
    "mini-racer==0.14.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.60.0",
    "litellm>=1.55.0",
    "sse-starlette>=2.0.0",
    "pypinyin>=0.52.0",
    "tdxhub-sdk==0.3.1",
    "feedparser>=6.0.12",
    "beautifulsoup4>=4.12.0",
    "cryptography>=44.0.0",
    "pyyaml>=6.0",
    "scrapling[fetchers]>=0.4",
    "curl-cffi>=0.13.0",
    "httpx>=0.28.0",
    "packaging>=24.0",
    "playwright>=1.55.0",
    "pypdf>=6.21.2",
    "pdfplumber>=0.11.10",
    "pandas>=2.2.0",
    "requests[socks]>=2.31.0",
    # urllib3 2.x 的 SOCKS 支持走 socksio，requests[socks] 只覆盖 PySocks 分支
    "socksio>=1.0.0",
    "lxml>=5.0.0",
    "exchange-calendars>=4.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.17.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.0",
]

[tool.uv]
# AkShare 的两个旧 Linux 包与 mini-racer 共用 py_mini_racer 命名空间，
# 不可同时安装。统一使用带 Linux amd64/arm64 原生 wheel 的现代运行时。
# 不可能成立的 marker 按 uv override 语义移除这两个传递依赖。
override-dependencies = [
    "py-mini-racer; sys_platform == 'never'",
    "akracer; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# 覆盖率棘轮：实测约 44.5%，先钉在 44%；后续提升覆盖面后同步上调此值，只升不降。
fail_under = 44
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conservative baseline: pyflakes (F), import sorting (I) and core pycodestyle (E).
# Line length is enforced by the formatter, not the linter, so E501 is ignored.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# self-test/demo blocks and package inits keep their imports/prints
"**/__init__.py" = ["F401"]

