limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 认证端点的独立限速：登录/注册/重置密码每次都要跑 200k 轮 PBKDF2（约 50-100ms CPU），
# 与业务接口共用 10r/s 会让撞库/扫描直接打满后端线程池。这里收紧到 30r/m（突发 5）。
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    # 主数据文件上限 50 MiB；Base64 膨胀和 JSON 元数据需约 67 MiB。
    client_max_body_size 70m;

    root /usr/share/nginx/html;
    index index.html;

    # ── 安全头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    # 国家队等大盘商品接口的响应体可达数 MB。默认的 gzip_proxied off 会让所有
    # 经 proxy_pass 的 /api/ 响应都不压缩，前端只能收明文 JSON。
    gzip_proxied any;
    # 让上游/中间缓存按 Accept-Encoding 分开缓存，避免把压缩体发给不支持的客户端。
    gzip_vary on;

    location = /index.html {
        expires -1;
    }

    location /assets/ {
        expires 1y;
    }

    # 只收紧"凭证类"端点：这些路径每次都要跑 200k 轮 PBKDF2，撞库/扫描会打满后端线程池。
    # /auth/me、/auth/sessions 等高频只读路径仍走下面的 /api/ 限速，避免误伤正常使用。
    location ~ ^/api/auth/(login|register|reset-password)$ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 普通 API 使用 Nginx 默认缓冲；SSE 响应通过 X-Accel-Buffering: no 单独关闭。

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
