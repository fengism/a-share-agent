<!doctype html>
<html lang="zh-CN" data-theme="stellar-blue">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="智能投研平台 —— 实时行情、资金流向、龙虎榜、宏观数据与 AI 深度个股分析。" />
    <meta name="theme-color" content="#0c0f17" />
    <title>智能投研平台</title>
    <script>
      // Anti-FOUC: paint the persisted theme background before React mounts,
      // so there is no white flash on load (theme is persisted by zustand).
      (function () {
        try {
          var raw = localStorage.getItem("a-share-agent-theme");
          var key = raw ? (JSON.parse(raw).state || {}).themeKey : null;
          var BG = { "stellar-blue": "#0c0f17", light: "#fbf9f5" };
          var FG = { "stellar-blue": "#f9fafb", light: "#1c1917" };
          var k = BG[key] ? key : "stellar-blue";
          var root = document.documentElement;
          root.setAttribute("data-theme", k);
          root.style.setProperty("--boot-bg", BG[k]);
          root.style.setProperty("--boot-fg", FG[k]);
          root.style.background = BG[k];
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: var(--boot-bg, #0c0f17); }
      #app-boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: var(--boot-bg, #0c0f17); color: var(--boot-fg, #f9fafb);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #app-boot .logo {
        width: 46px; height: 46px; border-radius: 12px;
        background: linear-gradient(135deg, #b45309, #f59e0b);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 24px rgba(180, 83, 9, 0.3);
      }
      #app-boot .ring {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid rgba(180, 83, 9, 0.2); border-top-color: #f59e0b;
        animation: bootspin 0.8s linear infinite;
      }
      #app-boot .label { font-size: 13px; letter-spacing: 0.04em; opacity: 0.72; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #app-boot .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Boot splash: replaced by React on first render (createRoot swaps #root children) -->
      <div id="app-boot">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 15l4.5-5 3.5 3.5L19 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 20h16" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
          </svg>
        </div>
        <div class="ring"></div>
        <div class="label">智能投研平台 · 加载中</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
