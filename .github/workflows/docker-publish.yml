name: Build & Publish Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "sandbox/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-publish.yml"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "sandbox/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-publish.yml"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  # 串行推进发布标记，避免旧任务在别名更新到一半时被新任务取消。
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: fengliu1989
  BACKEND_IMAGE: fengliu1989/a-share-backend
  FRONTEND_IMAGE: fengliu1989/a-share-frontend
  PYTHON_RUNNER_IMAGE: fengliu1989/a-share-python-runner
  PYTHON_SANDBOX_IMAGE: fengliu1989/a-share-python-sandbox

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint backend and sandbox
        working-directory: backend
        run: |
          uv run --frozen ruff check app scripts ../sandbox
          uv run --frozen mypy
          uv run --frozen mypy ../sandbox

      - name: Check backend module boundaries
        working-directory: backend
        run: uv run --frozen python -m scripts.check_import_boundaries

      - name: Install native Chromium for rendering tests
        working-directory: backend
        run: uv run --frozen patchright install --with-deps --no-shell chromium

      - name: Test backend
        working-directory: backend
        env:
          CONFIG_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          if [ ! -d tests ]; then
            echo "::notice::backend/tests 不存在（测试已随模块重构移除），跳过后端单元测试"
            exit 0
          fi
          uv run --frozen coverage run -m pytest -q
          # 覆盖率棘轮：下限与 backend/pyproject.toml 的 [tool.coverage.report] fail_under 保持一致
          uv run --frozen coverage report --fail-under=44

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run build
          npm run api:check

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Chromium 没有中文字体时会回退到默认字体，中文换行与行高随之改变，
      # 导致依赖像素布局的 E2E 在 CI 上失败（本地与 runner 渲染不一致）。
      - name: Install CJK fonts for deterministic layout
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
          fc-cache -f

      - name: Run full frontend E2E gate
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        # 上传失败（如 blob 存储 ECONNRESET）不应掩盖真正的 E2E 失败信息
        continue-on-error: true
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    needs: [verify, frontend-e2e]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    outputs:
      version: ${{ steps.app-version.outputs.version }}
      release-marker: ${{ steps.app-version.outputs.release-marker }}
    steps:
      - uses: actions/checkout@v4

      - id: app-version
        name: Resolve application version
        working-directory: backend
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
            if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "Git tag $version is not a supported semantic version (expected vMAJOR.MINOR.PATCH)" >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release-marker=release-$version-sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            version="v${project_version#v}-dev-${GITHUB_SHA::7}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release-marker=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (with retry)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Docker Hub 偶发 502/超时属瞬时故障，登录重试避免整条发布流水线失败。
          for attempt in 1 2 3 4 5; do
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            echo "::warning::docker login attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::docker login failed after 5 attempts"
          exit 1

      - id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          context: ./backend
          outputs: type=image,name=${{ env.BACKEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}
          build-args: |
            APP_UID=1000
            APP_GID=1000
            APP_VERSION=${{ steps.app-version.outputs.version }}
            APP_REVISION=${{ github.sha }}

      - name: Smoke-test native image before promotion
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in
            x86_64) host_arch=amd64 ;;
            aarch64|arm64) host_arch=arm64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          test "$host_arch" = "$EXPECTED_ARCH"
          image="$BACKEND_IMAGE@$IMAGE_DIGEST"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$EXPECTED_ARCH"
          docker run --rm --network none --read-only --memory=2g --init \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            --tmpfs /app/data:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /app/logs:rw,size=32m,uid=1000,gid=1000,mode=0700 \
            -e PYTHONPATH=/app -e EXPECTED_ARCH="$EXPECTED_ARCH" -e VERIFY_NO_HEADLESS_SHELL=1 \
            --entrypoint python "$image" scripts/verify_browser_runtime.py
          docker run --rm --network none --read-only --memory=2g --init \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,size=512m,mode=1777 \
            --tmpfs /app/data:rw,size=128m,uid=1000,gid=1000,mode=0700 \
            --tmpfs /app/logs:rw,size=32m,uid=1000,gid=1000,mode=0700 \
            -e APP_DATA_DIR=/app/data -e PYTHONPATH=/app -e HTTP_TRUST_ENV=false \
            --entrypoint python "$image" scripts/verify_application_runtime.py

      - name: Export tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  frontend:
    needs: [verify, frontend-e2e]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (with retry)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Docker Hub 偶发 502/超时属瞬时故障，登录重试避免整条发布流水线失败。
          for attempt in 1 2 3 4 5; do
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            echo "::warning::docker login attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::docker login failed after 5 attempts"
          exit 1

      - id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          context: ./frontend
          outputs: type=image,name=${{ env.FRONTEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}

      - name: Smoke-test native image before promotion
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in
            x86_64) host_arch=amd64 ;;
            aarch64|arm64) host_arch=arm64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          test "$host_arch" = "$EXPECTED_ARCH"
          image="$FRONTEND_IMAGE@$IMAGE_DIGEST"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$EXPECTED_ARCH"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 \
            --add-host backend:127.0.0.1 --entrypoint nginx "$image" -t

      - name: Export tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-frontend-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  python-runner:
    needs: [verify, frontend-e2e]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (with retry)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Docker Hub 偶发 502/超时属瞬时故障，登录重试避免整条发布流水线失败。
          for attempt in 1 2 3 4 5; do
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            echo "::warning::docker login attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::docker login failed after 5 attempts"
          exit 1

      - id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          context: ./sandbox
          target: runner
          outputs: type=image,name=${{ env.PYTHON_RUNNER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=python-runner-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=python-runner-${{ matrix.arch }}

      - name: Smoke-test native image before promotion
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in
            x86_64) host_arch=amd64 ;;
            aarch64|arm64) host_arch=arm64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          test "$host_arch" = "$EXPECTED_ARCH"
          image="$PYTHON_RUNNER_IMAGE@$IMAGE_DIGEST"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$EXPECTED_ARCH"
          docker run --rm --network none --entrypoint python "$image" \
            -c 'import runner, subprocess; subprocess.run(["docker", "--version"], check=True)'

      - name: Export tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-python-runner-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  python-sandbox:
    needs: [verify, frontend-e2e]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (with retry)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Docker Hub 偶发 502/超时属瞬时故障，登录重试避免整条发布流水线失败。
          for attempt in 1 2 3 4 5; do
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            echo "::warning::docker login attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::docker login failed after 5 attempts"
          exit 1

      - id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ matrix.arch }}
          context: ./sandbox
          target: worker
          outputs: type=image,name=${{ env.PYTHON_SANDBOX_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=python-sandbox-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=python-sandbox-${{ matrix.arch }}

      - name: Smoke-test native image before promotion
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in
            x86_64) host_arch=amd64 ;;
            aarch64|arm64) host_arch=arm64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          test "$host_arch" = "$EXPECTED_ARCH"
          image="$PYTHON_SANDBOX_IMAGE@$IMAGE_DIGEST"
          docker pull "$image"
          test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$EXPECTED_ARCH"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 \
            --entrypoint python "$image" -c 'import numpy, pandas; assert numpy.array([1, 2]).sum() == 3'

      - name: Export tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-python-sandbox-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  sandbox-integration:
    needs: [python-runner, python-sandbox]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digests-python-runner-${{ matrix.arch }}
          path: ${{ runner.temp }}/runner
      - uses: actions/download-artifact@v4
        with:
          name: digests-python-sandbox-${{ matrix.arch }}
          path: ${{ runner.temp }}/worker
      - name: Log in to Docker Hub (with retry)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Docker Hub 偶发 502/超时属瞬时故障，登录重试避免整条发布流水线失败。
          for attempt in 1 2 3 4 5; do
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            echo "::warning::docker login attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::docker login failed after 5 attempts"
          exit 1
      - name: Execute real sandbox jobs on native daemon
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          runner_image="$PYTHON_RUNNER_IMAGE@$(cat "$RUNNER_TEMP/runner/$ARCH")"
          worker_image="$PYTHON_SANDBOX_IMAGE@$(cat "$RUNNER_TEMP/worker/$ARCH")"
          docker pull "$runner_image"
          docker pull "$worker_image"
          docker run --rm --read-only --init --memory=256m --pids-limit=64 \
            --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e PYTHON_SANDBOX_TOKEN=ci-only-not-a-production-secret-0000 \
            -e PYTHON_SANDBOX_IMAGE="$worker_image" \
            --entrypoint python "$runner_image" /opt/verify_runtime.py

  publish:
    needs: [backend, frontend, python-runner, python-sandbox, sandbox-integration]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (with retry)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Docker Hub 偶发 502/超时属瞬时故障，登录重试避免整条发布流水线失败。
          for attempt in 1 2 3 4 5; do
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            echo "::warning::docker login attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::docker login failed after 5 attempts"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-backend-*
          path: ${{ runner.temp }}/digests/backend
          merge-multiple: true

      - name: Assemble tested backend multi-arch index
        id: backend-index
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/backend/amd64")
          arm64=$(cat "$RUNNER_TEMP/digests/backend/arm64")
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Run-scoped staging tag; stable aliases are promoted only after all indexes validate.
          staging="$BACKEND_IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$staging" "$BACKEND_IMAGE@$amd64" "$BACKEND_IMAGE@$arm64"
          docker buildx imagetools inspect --raw "$staging" > "$RUNNER_TEMP/backend-index.json"
          python scripts/verify_image_index.py "$RUNNER_TEMP/backend-index.json"
          digest=$(docker buildx imagetools inspect "$staging" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-frontend-*
          path: ${{ runner.temp }}/digests/frontend
          merge-multiple: true

      - name: Assemble tested frontend multi-arch index
        id: frontend-index
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/frontend/amd64")
          arm64=$(cat "$RUNNER_TEMP/digests/frontend/arm64")
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Run-scoped staging tag; stable aliases are promoted only after all indexes validate.
          staging="$FRONTEND_IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$staging" "$FRONTEND_IMAGE@$amd64" "$FRONTEND_IMAGE@$arm64"
          docker buildx imagetools inspect --raw "$staging" > "$RUNNER_TEMP/frontend-index.json"
          python scripts/verify_image_index.py "$RUNNER_TEMP/frontend-index.json"
          digest=$(docker buildx imagetools inspect "$staging" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-python-runner-*
          path: ${{ runner.temp }}/digests/python-runner
          merge-multiple: true

      - name: Assemble tested python-runner multi-arch index
        id: python-runner-index
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/python-runner/amd64")
          arm64=$(cat "$RUNNER_TEMP/digests/python-runner/arm64")
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Run-scoped staging tag; stable aliases are promoted only after all indexes validate.
          staging="$PYTHON_RUNNER_IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$staging" "$PYTHON_RUNNER_IMAGE@$amd64" "$PYTHON_RUNNER_IMAGE@$arm64"
          docker buildx imagetools inspect --raw "$staging" > "$RUNNER_TEMP/python-runner-index.json"
          python scripts/verify_image_index.py "$RUNNER_TEMP/python-runner-index.json"
          digest=$(docker buildx imagetools inspect "$staging" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digests-python-sandbox-*
          path: ${{ runner.temp }}/digests/python-sandbox
          merge-multiple: true

      - name: Assemble tested python-sandbox multi-arch index
        id: python-sandbox-index
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/python-sandbox/amd64")
          arm64=$(cat "$RUNNER_TEMP/digests/python-sandbox/arm64")
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Run-scoped staging tag; stable aliases are promoted only after all indexes validate.
          staging="$PYTHON_SANDBOX_IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$staging" "$PYTHON_SANDBOX_IMAGE@$amd64" "$PYTHON_SANDBOX_IMAGE@$arm64"
          docker buildx imagetools inspect --raw "$staging" > "$RUNNER_TEMP/python-sandbox-index.json"
          python scripts/verify_image_index.py "$RUNNER_TEMP/python-sandbox-index.json"
          digest=$(docker buildx imagetools inspect "$staging" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=main,enable=${{ github.ref_type == 'tag' }}

      - id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=main,enable=${{ github.ref_type == 'tag' }}

      - id: python-runner-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PYTHON_RUNNER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=main,enable=${{ github.ref_type == 'tag' }}

      - id: python-sandbox-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PYTHON_SANDBOX_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=main,enable=${{ github.ref_type == 'tag' }}

      - name: Promote frontend image
        shell: bash
        env:
          DIGEST: ${{ steps.frontend-index.outputs.digest }}
          METADATA_JSON: ${{ steps.frontend-meta.outputs.json }}
        run: |
          tags=(--tag "$FRONTEND_IMAGE:sha-${GITHUB_SHA::7}")
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          docker buildx imagetools create "${tags[@]}" "$FRONTEND_IMAGE@$DIGEST"

      - name: Promote python-runner image
        shell: bash
        env:
          DIGEST: ${{ steps.python-runner-index.outputs.digest }}
          METADATA_JSON: ${{ steps.python-runner-meta.outputs.json }}
        run: |
          tags=(--tag "$PYTHON_RUNNER_IMAGE:sha-${GITHUB_SHA::7}")
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          docker buildx imagetools create "${tags[@]}" "$PYTHON_RUNNER_IMAGE@$DIGEST"

      - name: Promote python-sandbox image
        shell: bash
        env:
          DIGEST: ${{ steps.python-sandbox-index.outputs.digest }}
          METADATA_JSON: ${{ steps.python-sandbox-meta.outputs.json }}
        run: |
          tags=(--tag "$PYTHON_SANDBOX_IMAGE:sha-${GITHUB_SHA::7}")
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          docker buildx imagetools create "${tags[@]}" "$PYTHON_SANDBOX_IMAGE@$DIGEST"

      - name: Promote backend public aliases
        shell: bash
        env:
          DIGEST: ${{ steps.backend-index.outputs.digest }}
          METADATA_JSON: ${{ steps.backend-meta.outputs.json }}
        run: |
          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          if (( ${#tags[@]} > 0 )); then
            docker buildx imagetools create "${tags[@]}" "$BACKEND_IMAGE@$DIGEST"
          fi

      - name: Publish backend immutable image
        shell: bash
        env:
          DIGEST: ${{ steps.backend-index.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$BACKEND_IMAGE:sha-${GITHUB_SHA::7}" \
            "$BACKEND_IMAGE@$DIGEST"

      # release marker 必须最后发布；它出现时代表同一 revision 的前后端及沙箱镜像都已可用。
      - name: Publish complete release marker
        if: needs.backend.outputs.release-marker != ''
        shell: bash
        env:
          DIGEST: ${{ steps.backend-index.outputs.digest }}
          RELEASE_MARKER: ${{ needs.backend.outputs.release-marker }}
        run: |
          docker buildx imagetools create \
            --tag "$BACKEND_IMAGE:$RELEASE_MARKER" \
            "$BACKEND_IMAGE@$DIGEST"
